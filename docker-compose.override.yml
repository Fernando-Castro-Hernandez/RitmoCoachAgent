# Lo que cambia en local. Compose carga este archivo solo, sin decírselo.
#
# En el EC2 no existe —el despliegue clona el repositorio y lo borra— así que
# `docker compose up` allí levanta la versión de producción sin más ceremonia.
#
# La diferencia que justifica la separación son las credenciales de AWS: aquí
# se montan desde `~/.aws`, y en el servidor las da el rol de instancia. El
# montaje no puede quedarse en el archivo de producción porque un volumen que
# apunta a un directorio inexistente no falla: Docker lo crea vacío, y el error
# aparece luego como «no encuentro credenciales» en una máquina que sí las
# tiene. Un fallo callado en el sitio equivocado.

services:
  api:
    volumes:
      - ${HOME}/.aws:/root/.aws:ro

  n8n:
    # **Aquí NO se redeclara el puerto.** Compose no reemplaza la lista `ports`
    # de un override: la AÑADE. Poner `5678:5678` aquí dejaba dos
    # publicaciones del mismo puerto —`0.0.0.0:5678` y `127.0.0.1:5678`—, y
    # Docker liga la primera, encuentra la segunda ocupada por él mismo y se
    # niega a arrancar con «address already in use» señalando a un puerto que
    # no usa nadie más. `docker compose up n8n` no funcionaba en local.
    #
    # No hace falta: la publicación de producción es `127.0.0.1:5678`, y el
    # navegador de esta misma máquina llega ahí por http://localhost:5678.
    environment:
      # El navegador llega a la API por localhost, no por la red de Compose.
      #
      # Para grabar el vídeo sin abrir un túnel al servidor: pon en el `.env`
      #   RITMO_API_URL=https://54-80-131-31.sslip.io
      # y levanta sólo `db` y `n8n`. Los flujos consultan la API de producción
      # —datos reales, cuenta demo real— desde un n8n local en localhost:5678.
      RITMO_API_URL: ${RITMO_API_URL:-http://api:8000}
