# Este archivo es el de PRODUCCIÓN. Lo de local vive en
# `docker-compose.override.yml`, que Compose carga solo y que aquí no aplica.
#
# La separación existe por un detalle concreto: en local la API usa las
# credenciales de `~/.aws` montadas como volumen, y en el EC2 usa el rol de
# instancia. Un volumen que apunta a un directorio inexistente no falla — lo
# crea vacío — así que el error sería «no encuentro credenciales» en un sitio
# donde sí las hay. Mejor que el montaje no exista en producción.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ritmo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      POSTGRES_DB: ritmo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritmo -d ritmo"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Migraciones. Corren y salen; nadie sirve tráfico hasta que terminan.
  #
  # Va en su propio servicio y no en el arranque de la API por una razón que se
  # nota con más de una réplica: dos APIs arrancando a la vez lanzarían Alembic
  # dos veces sobre la misma base. Aquí sólo hay una que puede hacerlo.
  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://ritmo:${DB_PASSWORD}@db:5432/ritmo
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://ritmo:${DB_PASSWORD}@db:5432/ritmo
      AWS_REGION: ${AWS_REGION:-us-east-1}
      NOVA_MODEL_ID: ${NOVA_MODEL_ID:-amazon.nova-2-sonic-v1:0}
      NOVA_VOICE_ID: ${NOVA_VOICE_ID:-carlos}

      # Visión: API directa de Anthropic, no Bedrock (ADR 0014).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VISION_MODEL_CHAIN: ${VISION_MODEL_CHAIN:-claude-haiku-4-5-20251001}

      # Sin esto la API firma con un secreto de proceso y cada reinicio del
      # contenedor cierra la sesión de todo el mundo.
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      AUTOMATION_API_KEY: ${AUTOMATION_API_KEY:-}

      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: ritmo
      DB_POSTGRESDB_USER: ritmo
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?falta N8N_ENCRYPTION_KEY en .env}
      GENERIC_TIMEZONE: America/Mexico_City
      N8N_PORT: 5678

      # Los cinco flujos leen estas dos con `$env`. Sin la primera variable de
      # abajo, n8n bloquea el acceso al entorno desde los nodos y las
      # expresiones se resuelven vacías — el flujo llamaría a `/api/...` sin
      # host y fallaría en silencio.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Se puede apuntar a otra API sin tocar este archivo. Sirve para grabar:
      # n8n corriendo en el portátil contra la API de producción, que es donde
      # están los datos de verdad. Por defecto, la API de al lado.
      RITMO_API_URL: ${RITMO_API_URL:-http://api:8000}
      RITMO_AUTOMATION_KEY: ${AUTOMATION_API_KEY:-}
    ports:
      # SÓLO en el bucle local. n8n trae su propia interfaz de administración y
      # publicarla en internet sería regalar el panel que dispara los avisos y
      # guarda las credenciales del bot. Se llega por un túnel de SSM.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./automation/n8n:/workflows:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      # En producción es el dominio real y Caddy emite el certificado solo.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  n8ndata:
  caddydata:
  caddyconfig:
