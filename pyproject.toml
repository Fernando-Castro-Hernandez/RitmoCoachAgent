[project]
name = "ritmo"
version = "0.1.0"
description = "Coach de voz conversacional para runners de 5K a maratón"
requires-python = ">=3.13"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "httpx>=0.28",
  # Streaming bidireccional de Bedrock, verificado en la tarea A2 (ADR 0002).
  # awscrt aporta el transporte HTTP/2 que la API exige.
  # Sin tope superior: el ejemplo oficial fija <0.2.0, que corresponde a la API
  # vieja con BedrockRuntimeClient. Nosotros usamos AsyncBedrockRuntimeClient.
  "aws-sdk-bedrock-runtime>=0.2.0",
  "smithy-aws-core>=0.0.1",
  "awscrt>=0.32",
  "aiohttp>=3.10",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.112",
  "mypy>=1.13",
  "ruff>=0.7",
  "poethepoet>=0.30",
  "types-pyyaml>=6.0",
]

[tool.uv]
package = false

# ─── Corredor de tareas ────────────────────────────────────────────────
# poe funciona igual en Windows y en Linux. El Makefile reenvía aquí.
[tool.poe.tasks]
dev        = "docker compose up --build"
down       = "docker compose down"
web        = "npm --prefix apps/web run dev"
test       = "pytest packages apps -v"
test-dom   = "pytest packages -v --cov=coach_domain --cov-fail-under=95"
evals      = "python evals/run.py"
fmt        = "ruff format ."
purity     = "python scripts/check_domain_purity.py"
deploy     = "bash infra/deploy.sh"

# `python -m uvicorn` en vez del ejecutable: así el directorio actual entra en
# sys.path y `apps.api` se importa. PYTHONPATH añade el motor de dominio.
# El contenedor ya define ambos (infra/Dockerfile.api); esto es para local.
[tool.poe.tasks.api]
help = "API en local con recarga automática"
cmd = "python -m uvicorn apps.api.main:app --reload --port 8000"
env = { PYTHONPATH = "packages" }

[tool.poe.tasks.lint]
sequence = [
  { cmd = "ruff check ." },
  { cmd = "ruff format --check ." },
  { cmd = "mypy packages" },
]

[tool.poe.tasks.check]
help     = "Todo lo que corre CI, en orden"
sequence = ["lint", "purity", "test-dom", "test", "evals"]

# ─── Herramientas ──────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["spikes", "apps/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# El proyecto está documentado en español con tipografía correcta: rayas, comillas
# angulares y guiones largos son intencionales, no caracteres confundibles.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["packages"]
mypy_path = "packages"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["packages", "."]
testpaths = ["packages/tests", "apps/api/tests"]
filterwarnings = ["error::DeprecationWarning"]
